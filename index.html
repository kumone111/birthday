<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生日惊喜 · 弹窗祝福</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      background: #1e1a2b; /* fallback */
      position: relative;
      overflow: hidden;
    }

    /* 背景图片 — 花体字生日快乐 */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.9;
      pointer-events: none;
    }

    /* 中央礼物盒 + 按钮区域 */
    .gift-section {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.6s ease, transform 0.5s ease;
      cursor: pointer;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      border-radius: 60px 20px 60px 20px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3), 0 0 0 2px rgba(255, 240, 200, 0.5) inset;
    }

    .gift-section.hide {
      opacity: 0;
      transform: scale(0.7);
      pointer-events: none;
      transition: opacity 0.5s, transform 0.5s;
    }

    .gift-box {
      font-size: 7rem;
      line-height: 1;
      filter: drop-shadow(0 12px 10px rgba(0, 0, 0, 0.3));
      animation: float 2.2s infinite alternate ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(4deg); }
    }

    .open-btn {
      background: linear-gradient(145deg, #ffd966, #f7b32b);
      border: none;
      color: #3b2a1c;
      font-weight: 800;
      font-size: 1.8rem;
      padding: 0.9rem 2.5rem;
      border-radius: 80px;
      letter-spacing: 3px;
      box-shadow: 0 10px 0 #a05c15, 0 15px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.1s ease;
      text-shadow: 2px 2px 0 #ffe28c;
      font-family: 'Segoe UI', 'Poppins', cursive;
      transform: translateY(0);
      white-space: nowrap;
    }

    .open-btn:active {
      box-shadow: 0 4px 0 #a05c15, 0 10px 15px rgba(0, 0, 0, 0.2);
      transform: translateY(6px);
    }

    /* 弹窗容器，放在顶层，但是不阻挡点击（除非有弹窗出现） */
    .popup-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;  /* 允许点击穿透到下面的礼物按钮 */
      z-index: 40;
    }

    /* 每个祝福弹窗 */
    .bless-popup {
      position: absolute;
      pointer-events: auto;  /* 弹窗本身可以有点击/交互，但不用点击，只是看起来舒服 */
      background: rgba(255, 245, 230, 0.9);
      backdrop-filter: blur(8px);
      border: 2px solid #ffcf8a;
      border-radius: 30px 10px 30px 10px;
      padding: 1.2rem 2rem;
      font-size: 1.5rem;
      font-weight: 600;
      color: #4a2e1b;
      box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.4), 0 0 0 4px rgba(255, 230, 170, 0.5);
      white-space: nowrap;
      max-width: 85vw;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Segoe UI', 'Poppins', 'Comic Sans MS', cursive;
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: default;
      backdrop-filter: blur(10px);
      background: linear-gradient(135deg, #fff7e8, #fff0db);
      z-index: 50;
      box-sizing: border-box;
      line-height: 1.3;
      text-align: center;
    }

    /* 让弹窗有微微的浮动感 */
    .bless-popup:hover {
      transform: scale(1.02);
      box-shadow: 0 22px 35px -8px rgba(0, 0, 0, 0.5), 0 0 0 6px rgba(255, 215, 120, 0.7);
    }

    @keyframes popIn {
      0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
      70% { transform: scale(1.05) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* 重置按钮（右下角小按钮，方便再玩一次） */
    .reset-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      background: rgba(255, 220, 150, 0.8);
      backdrop-filter: blur(6px);
      border: 2px solid #ffffffb3;
      border-radius: 50px;
      padding: 12px 24px;
      font-weight: 600;
      color: #3b2a1c;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0;
      pointer-events: none;
      font-family: inherit;
    }

    .reset-btn.show {
      opacity: 1;
      pointer-events: auto;
    }

    .reset-btn:hover {
      background: #ffe8b5;
      transform: scale(1.05);
    }

    /* 适配小屏幕 */
    @media (max-width: 600px) {
      .gift-box { font-size: 5rem; }
      .open-btn { font-size: 1.3rem; padding: 0.7rem 1.8rem; letter-spacing: 2px; }
      .bless-popup { font-size: 1.1rem; padding: 0.8rem 1.3rem; white-space: normal; min-width: 150px; }
      .gift-section { padding: 1.5rem; gap: 1rem; }
    }
  </style>
</head>
<body>
  <!-- 背景图片：花体字生日快乐 (内联SVG) -->
  <svg class="bg-image" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fdeff2" />
        <stop offset="50%" stop-color="#f8e0e8" />
        <stop offset="100%" stop-color="#f3d9e4" />
      </linearGradient>
      <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
        <feOffset dx="0" dy="4" result="offsetblur" />
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.3" />
        </feComponentTransfer>
        <feMerge>
          <feMergeNode />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    <!-- 背景填充 -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />

    <g filter="url(#softGlow)">
      <path d="M180,300 Q220,180 330,200 Q400,215 430,250 Q460,280 500,260 Q550,230 590,280 Q630,330 590,380 Q560,420 500,400 Q450,380 410,340 Q380,310 340,350 Q300,390 240,380 Q190,370 170,320 Q150,260 180,300 Z" 
            fill="#c44b6b" opacity="0.75" />
    </g>

    <text x="600" y="350" font-family="'Brush Script MT', 'Lucida Calligraphy', 'Dancing Script', 'Pacifico', cursive, 'Comic Sans MS'" 
          font-size="140" fill="#b34e6b" text-anchor="middle" font-weight="bold" letter-spacing="8"
          transform="rotate(-5, 600, 350)" opacity="0.9" style="font-style: italic; text-shadow: 4px 4px 0 #f0c0d0;">
      Happy Birthday
    </text>
    <text x="600" y="490" font-family="'Brush Script MT', 'Lucida Calligraphy', 'Dancing Script', 'Pacifico', cursive, 'Comic Sans MS'" 
          font-size="100" fill="#9e3d5c" text-anchor="middle" font-weight="bold" letter-spacing="6"
          transform="rotate(-3, 600, 490)" opacity="0.9" style="font-style: italic; text-shadow: 3px 3px 0 #f0c0d0;">
      🎂 生日快乐 🎂
    </text>
    <!-- 加一些装饰小点 -->
    <circle cx="200" cy="600" r="12" fill="#e8b3c5" opacity="0.7" />
    <circle cx="1000" cy="200" r="25" fill="#e8b3c5" opacity="0.5" />
    <circle cx="950" cy="650" r="18" fill="#e8b3c5" opacity="0.6" />
    <circle cx="300" cy="150" r="20" fill="#e8b3c5" opacity="0.6" />
    <path d="M80,700 Q150,650 200,680 Q250,710 300,680 Q350,650 400,690" stroke="#e8b3c5" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M850,120 Q920,80 980,110 Q1040,140 1080,100" stroke="#e8b3c5" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round"/>
  </svg>

  <!-- 礼物盒部分 -->
  <div class="gift-section" id="giftSection">
    <div class="gift-box">🎁</div>
    <button class="open-btn" id="openBtn">点击开启妳的惊喜</button>
  </div>

  <!-- 弹窗容器 -->
  <div class="popup-container" id="popupContainer"></div>

  <!-- 重置按钮 -->
  <button class="reset-btn" id="resetBtn">✨ 再来一次 ✨</button>

  <script>
    (function() {
      const blessings = [
        "🎂 生日快乐！愿妳永远被爱包围！",
        "✨ 愿妳的每一天都闪闪发光！",
        "🌸 祝妳像花儿一样美丽绽放！",
        "💖 愿所有的美好都如期而至！",
        "🌈 希望妳的生活甜过彩虹糖！",
        "🌟 妳是今天最闪亮的那颗星！",
        "🥳 生日快乐！要一直快乐呀！",
        "🎈 愿妳永远拥有少女心！",
        "🍰 吃蛋糕不胖，许愿都成真！",
        "💫 愿妳被世界温柔以待～",
        "🦄 像独角兽一样独特又迷人！",
        "🍀 好运永远伴随妳左右！",
        "☀️ 愿妳的笑容比阳光更灿烂！",
        "🌙 每一个梦想都能照进现实～",
        "🧸 永远有人宠妳像小孩！",
        "🎉 生日快乐！新的一岁万事胜意！",
        "💐 愿妳拥有整片花海的浪漫！",
        "🍭 生活甜甜的，烦恼远远的！",
        "🕊️ 自由如风，快乐如歌！",
        "⭐ 所有的星星都為妳闪烁！",
        "🌺 祝妳每一天都充满惊喜！",
        "💝 愿这份惊喜永远留在心里！",
        "🎁 妳是世界上最棒的礼物！",
        "🎀 生日快乐！要永远可爱！"
      ];

      let usedIndices = new Set();
      const totalBlessings = blessings.length;

      let isOpened = false;           
      let blessingInterval = null;    
      let currentPopupCount = 0;      
      const MAX_POPUPS = blessings.length; 

      const giftSection = document.getElementById('giftSection');
      const openBtn = document.getElementById('openBtn');
      const popupContainer = document.getElementById('popupContainer');
      const resetBtn = document.getElementById('resetBtn');

      function resetAll() {
        if (blessingInterval) {
          clearInterval(blessingInterval);
          blessingInterval = null;
        }
        popupContainer.innerHTML = '';
        usedIndices.clear();
        currentPopupCount = 0;
        isOpened = false;
        giftSection.classList.remove('hide');
        resetBtn.classList.remove('show');
      }

      function getRandomUnusedBlessing() {
        if (usedIndices.size >= totalBlessings) {
          return null; 
        }
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * totalBlessings);
        } while (usedIndices.has(randomIndex));
        usedIndices.add(randomIndex);
        return blessings[randomIndex];
      }

      function createPopup(text) {
        if (!text) return;

        const popup = document.createElement('div');
        popup.className = 'bless-popup';
        popup.textContent = text;

        const containerWidth = window.innerWidth;
        const containerHeight = window.innerHeight;

        popup.style.visibility = 'hidden';
        popup.style.left = '0px';
        popup.style.top = '0px';
        popupContainer.appendChild(popup);

        const popupWidth = popup.offsetWidth;
        const popupHeight = popup.offsetHeight;

        const maxLeft = Math.max(10, containerWidth - popupWidth - 10);
        const maxTop = Math.max(10, containerHeight - popupHeight - 10);

        const left = Math.random() * maxLeft;
        const top = Math.random() * maxTop;

        popup.style.left = left + 'px';
        popup.style.top = top + 'px';
        popup.style.visibility = 'visible';

        const rotate = (Math.random() - 0.5) * 6; 
        popup.style.transform = `rotate(${rotate}deg)`;

        currentPopupCount++;
        if (currentPopupCount >= MAX_POPUPS) {
          if (blessingInterval) {
            clearInterval(blessingInterval);
            blessingInterval = null;
          }
          resetBtn.classList.add('show');
        }
      }

      function startPopupSpree() {
        const firstBless = getRandomUnusedBlessing();
        if (firstBless) createPopup(firstBless);

        blessingInterval = setInterval(() => {
          if (usedIndices.size >= totalBlessings || currentPopupCount >= MAX_POPUPS) {
            if (blessingInterval) {
              clearInterval(blessingInterval);
              blessingInterval = null;
            }
            if (currentPopupCount >= MAX_POPUPS) {
              resetBtn.classList.add('show');
            }
            return;
          }
          const bless = getRandomUnusedBlessing();
          if (bless) {
            createPopup(bless);
          } else {
            if (blessingInterval) {
              clearInterval(blessingInterval);
              blessingInterval = null;
            }
            resetBtn.classList.add('show');
          }
        }, 350); 
      }

      function handleOpen() {
        if (isOpened) return; 
        isOpened = true;
        giftSection.classList.add('hide');
        startPopupSpree();
      }

      function handleReset() {
        resetAll();
      }

      openBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleOpen();
      });

      giftSection.addEventListener('click', (e) => {
        if (isOpened) return;
        if (e.target === openBtn) return;
        handleOpen();
      });

      resetBtn.addEventListener('click', handleReset);
    })();
  </script>
</body>
</html>
